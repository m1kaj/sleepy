[project]
name = "sleepy"
version = "0.1.0"
description = "Collect and analyse raw data from a Beddit B3 sleep sensor over BLE"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bleak>=3.0.2",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pytest>=9.1.1",
    "scipy>=1.17.1",
    "typer>=0.27.2",
]

[project.scripts]
sleepy = "sleepy.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sleepy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
